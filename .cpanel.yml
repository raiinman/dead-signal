---
deployment:
  tasks:
    - export ROOTPATH=$HOME/public_html/
    - export ONCEHUMANPATH=$HOME/oncehuman.deadsignaldb.com/
    - /bin/mkdir -p $ROOTPATH
    - /bin/cp -f index.html $ROOTPATH/index.html
    - /bin/cp -f portal.css $ROOTPATH/portal.css
    - /bin/mkdir -p $ONCEHUMANPATH
    - /bin/cp -R oncehuman/. $ONCEHUMANPATH/
    - /bin/mkdir -p $ONCEHUMANPATH/build-planner
    - /bin/cp -R oncehuman/preview/build-lab/. $ONCEHUMANPATH/build-planner/
    - /bin/echo 'Dead Signal DB portal deployed' > $ROOTPATH/deploy-status.txt
    - /bin/echo 'Once Human site deployed to subdomain' >> $ROOTPATH/deploy-status.txt
