---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/build-planner/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/echo 'Dead Signal static image deployment' > $DEPLOYPATH/deploy-status.txt
    - /bin/echo 'RUN copy Build Lab files' >> $DEPLOYPATH/deploy-status.txt
    - /bin/cp -f preview/build-lab/index.html $DEPLOYPATH/index.html
    - /bin/cp -f preview/build-lab/build-lab.css $DEPLOYPATH/build-lab.css
    - /bin/cp -f preview/build-lab/media-enhancements.css $DEPLOYPATH/media-enhancements.css
    - /bin/cp -f preview/build-lab/density-enhancements.css $DEPLOYPATH/density-enhancements.css
    - /bin/cp -f preview/build-lab/planner-cleanup.css $DEPLOYPATH/planner-cleanup.css
    - /bin/cp -f shared/readability.css $DEPLOYPATH/readability.css
    - /bin/cp -f shared/readability.js $DEPLOYPATH/readability.js
    - /bin/cp -f preview/build-lab/armor-image-map.js $DEPLOYPATH/armor-image-map.js
    - /bin/cp -f preview/build-lab/player-images.js $DEPLOYPATH/player-images.js
    - /bin/rm -f $DEPLOYPATH/media-enhancements.js
    - /bin/rm -f $DEPLOYPATH/cpanel-deploy-test.txt
    - /bin/echo 'OK copy Build Lab files' >> $DEPLOYPATH/deploy-status.txt
    - /bin/echo 'COMPLETE static image deployment' >> $DEPLOYPATH/deploy-status.txt
