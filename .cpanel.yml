    - /bin/cp -f preview/build-lab/build-mode.css $DEPLOYPATH/build-mode.css
    - /bin/cp -f preview/build-lab/build-mode.js $DEPLOYPATH/build-mode.js
    - /bin/cp -f preview/build-lab/weapon-model.css $DEPLOYPATH/weapon-model.css
    - /bin/cp -f preview/build-lab/weapon-model-ui.js $DEPLOYPATH/weapon-model-ui.js
    - /bin/cp -f preview/build-lab/weapon-layout.css $DEPLOYPATH/weapon-layout.css
    - /bin/cp -f preview/build-lab/weapon-layout.js $DEPLOYPATH/weapon-layout.js
    - /bin/cp -f preview/build-lab/calibration-details.css $DEPLOYPATH/calibration-details.css
