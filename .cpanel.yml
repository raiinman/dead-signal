---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/build-planner/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cat deploy/site.b64.part* | /usr/bin/base64 -d > /tmp/dead-signal-site.zip
    - /usr/bin/unzip -o /tmp/dead-signal-site.zip -d $DEPLOYPATH
    - >-
      /bin/sed -i 's|<span>Tier</span>|<span>Gear Tier</span>|g; s|<span>Blueprint</span>|<span>Blueprint Stars</span>|g' "$DEPLOYPATH/app.js"
    - >-
      /bin/sed -i 's|<a class="source-pill" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.site)}</a>|<span class="source-pill">Source: ${esc(s.site)}</span>|g' "$DEPLOYPATH/app.js"
    - >-
      /bin/sed -i 's|COMMUNITY v1.0|COMMUNITY v1.0.1|g' "$DEPLOYPATH/index.html"
    - /bin/rm -f /tmp/dead-signal-site.zip
