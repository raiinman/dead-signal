    - /bin/cp -f preview/build-lab/calibration-details-ui.js $DEPLOYPATH/calibration-details-ui.js
    - /bin/cp -f preview/build-lab/calibration-style-picker.css $DEPLOYPATH/calibration-style-picker.css
    - /bin/cp -f preview/build-lab/calibration-style-picker.js $DEPLOYPATH/calibration-style-picker.js
    - /bin/cp -f preview/build-lab/calibration-style-display.css $DEPLOYPATH/calibration-style-display.css
    - /bin/cp -f preview/build-lab/calibration-style-display.js $DEPLOYPATH/calibration-style-display.js
    - /bin/cp -f preview/build-lab/picker-card-polish.js $DEPLOYPATH/picker-card-polish.js
    - /bin/cp -f preview/build-lab/planner-state-bridge.js $DEPLOYPATH/planner-state-bridge.js
    - /bin/cp -f preview/build-lab/wm-data-01.js $DEPLOYPATH/wm-data-01.js
    - /bin/cp -f preview/build-lab/wm-data-02.js $DEPLOYPATH/wm-data-02.js
    - /bin/cp -f preview/build-lab/wm-data-03.js $DEPLOYPATH/wm-data-03.js
    - /bin/cp -f preview/build-lab/wm-data-04.js $DEPLOYPATH/wm-data-04.js
    - /bin/cp -f preview/build-lab/wm-data-05.js $DEPLOYPATH/wm-data-05.js
    - /bin/cp -f preview/build-lab/wm-data-06.js $DEPLOYPATH/wm-data-06.js
    - /bin/cp -f preview/build-lab/wm-data-07.js $DEPLOYPATH/wm-data-07.js
    - /bin/cp -f preview/build-lab/wm-data-08.js $DEPLOYPATH/wm-data-08.js
    - /bin/cp -f shared/readability.css $DEPLOYPATH/readability.css
