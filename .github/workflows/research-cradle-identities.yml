name: Research archived Cradle identities

on:
  push:
    branches: [main]
    paths: ['.github/workflows/research-cradle-identities.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p /tmp/ds
          7z x -y data.7z -o/tmp/ds >/dev/null
      - name: Audit normalized Cradle collisions
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path
          root=Path('/tmp/ds')
          source=None
          for path in root.rglob('cradles.json'):
              try: payload=json.loads(path.read_text(encoding='utf-8'))
              except Exception: continue
              if isinstance(payload,dict) and isinstance(payload.get('cradles'),list): source=(path,payload); break
          path,payload=source
          rows=[r for r in payload['cradles'] if isinstance(r,dict)]
          groups=defaultdict(list)
          for row in rows: groups[str(row.get('name') or '').strip().casefold()].append(row)
          multi={name:variants for name,variants in groups.items() if name and len(variants)>1}
          ignore={'id','name','image_reference','selected_image_reference','equipped_image_reference','disabled_image_reference'}
          freeze=lambda v: json.dumps(v,sort_keys=True,ensure_ascii=False,separators=(',',':'))
          changed=Counter(); distinct=[]; exact=[]; ids=[]
          for name,variants in multi.items():
              ids += [v.get('id') for v in variants]
              fields=sorted(set().union(*(v.keys() for v in variants))-ignore)
              diff=[field for field in fields if len({freeze(v.get(field)) for v in variants})>1]
              for field in diff: changed[field]+=1
              summary={'name':variants[0].get('name'),'ids':[v.get('id') for v in variants],'changed':diff}
              (distinct if diff else exact).append(summary)
          print('SOURCE',path)
          print('ROWS',len(rows),'NAME_FAMILIES',len(groups),'MULTI',len(multi))
          print('RAW_DISTINCT_MULTI',len(distinct),'RAW_EXACT_EXCEPT_ID_NAME_IMAGES',len(exact))
          print('UNIQUE_IDS',len(set(ids)),'OF',len(ids))
          print('CHANGED_FIELDS',json.dumps(changed,sort_keys=True))
          print('RAW_EXACT_FAMILIES')
          for row in exact: print(json.dumps(row,ensure_ascii=False,sort_keys=True))
          print('RAW_DISTINCT_EXAMPLES')
          for row in distinct[:25]: print(json.dumps(row,ensure_ascii=False,sort_keys=True))
          PY
