name: Probe public Once Human X timeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-oncehuman-x.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright client
        run: python -m pip install --disable-pip-version-check playwright

      - name: Probe X network timeline data
        run: |
          python - <<'PY'
          import asyncio, json, re, shutil
          from pathlib import Path
          from playwright.async_api import async_playwright

          URL = 'https://x.com/OnceHuman_'
          captured = []
          request_urls = []

          def first_string(data, *keys):
              if not isinstance(data, dict):
                  return ''
              for key in keys:
                  value = data.get(key)
                  if isinstance(value, str) and value.strip():
                      return value.strip()
              return ''

          def user_from_node(node):
              if not isinstance(node, dict):
                  return {}
              candidates = []
              for path in (
                  ('core', 'user_results', 'result'),
                  ('user_results', 'result'),
                  ('user',),
              ):
                  cur = node
                  ok = True
                  for key in path:
                      if not isinstance(cur, dict) or key not in cur:
                          ok = False
                          break
                      cur = cur[key]
                  if ok and isinstance(cur, dict):
                      candidates.append(cur)
              for user in candidates:
                  legacy = user.get('legacy') if isinstance(user.get('legacy'), dict) else user
                  screen = first_string(legacy, 'screen_name', 'screenName')
                  name = first_string(legacy, 'name')
                  avatar = first_string(legacy, 'profile_image_url_https', 'profile_image_url')
                  if screen or name:
                      return {'screen_name': screen, 'name': name, 'avatar': avatar}
              return {}

          def media_from_legacy(legacy):
              media = []
              if not isinstance(legacy, dict):
                  return media
              for source in (
                  (legacy.get('extended_entities') or {}).get('media', []) if isinstance(legacy.get('extended_entities'), dict) else [],
                  (legacy.get('entities') or {}).get('media', []) if isinstance(legacy.get('entities'), dict) else [],
              ):
                  if not isinstance(source, list):
                      continue
                  for item in source:
                      if not isinstance(item, dict):
                          continue
                      url = first_string(item, 'media_url_https', 'media_url')
                      if url and url not in media:
                          media.append(url)
              return media[:4]

          def walk(node, out):
              if isinstance(node, dict):
                  legacy = node.get('legacy') if isinstance(node.get('legacy'), dict) else None
                  rest_id = str(node.get('rest_id') or '')
                  if legacy and rest_id and rest_id.isdigit():
                      text = first_string(legacy, 'full_text', 'text')
                      if text:
                          user = user_from_node(node)
                          out.append({
                              'id': rest_id,
                              'text': text,
                              'created_at': first_string(legacy, 'created_at'),
                              'screen_name': user.get('screen_name', ''),
                              'name': user.get('name', ''),
                              'avatar': user.get('avatar', ''),
                              'media': media_from_legacy(legacy),
                              'reply_count': int(legacy.get('reply_count') or 0),
                              'retweet_count': int(legacy.get('retweet_count') or 0),
                              'favorite_count': int(legacy.get('favorite_count') or 0),
                          })
                  for value in node.values():
                      walk(value, out)
              elif isinstance(node, list):
                  for value in node:
                      walk(value, out)

          async def main():
              async with async_playwright() as p:
                  chrome = shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium')
                  if not chrome:
                      raise RuntimeError('No system Chrome/Chromium found on runner')

                  browser = await p.chromium.launch(executable_path=chrome, headless=True)
                  context = await browser.new_context(
                      viewport={"width": 1440, "height": 1200},
                      locale='en-US',
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
                  )
                  page = await context.new_page()

                  async def handle_response(response):
                      url = response.url
                      if '/graphql/' not in url and '/i/api/' not in url:
                          return
                      request_urls.append(url)
                      ctype = (response.headers.get('content-type') or '').lower()
                      if 'json' not in ctype:
                          return
                      try:
                          data = await response.json()
                      except Exception:
                          return
                      found = []
                      walk(data, found)
                      if found:
                          captured.extend(found)

                  page.on('response', handle_response)
                  response = await page.goto(URL, wait_until='domcontentloaded', timeout=60000)
                  await page.wait_for_timeout(12000)
                  for _ in range(4):
                      await page.mouse.wheel(0, 1000)
                      await page.wait_for_timeout(2200)
                  await page.wait_for_timeout(2500)

                  unique = {}
                  for post in captured:
                      current = unique.get(post['id'])
                      if not current or (not current.get('screen_name') and post.get('screen_name')):
                          unique[post['id']] = post

                  posts = sorted(unique.values(), key=lambda item: int(item['id']), reverse=True)
                  once_human = [p for p in posts if (p.get('screen_name') or '').lower() == 'oncehuman_']
                  result = {
                      'http_status': response.status if response else None,
                      'title': await page.title(),
                      'final_url': page.url,
                      'network_request_count': len(request_urls),
                      'network_urls': request_urls[:30],
                      'candidate_count': len(posts),
                      'oncehuman_count': len(once_human),
                      'oncehuman_posts': once_human[:12],
                      'candidate_preview': posts[:20],
                      'body_preview': (await page.locator('body').inner_text())[:6000],
                  }
                  print('PROBE_RESULT_BEGIN')
                  print(json.dumps(result, ensure_ascii=False, indent=2))
                  print('PROBE_RESULT_END')
                  Path('oncehuman-x-probe.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
                  await page.screenshot(path='oncehuman-x-probe.png', full_page=True)
                  await browser.close()

          asyncio.run(main())
          PY

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oncehuman-x-probe
          path: |
            oncehuman-x-probe.png
            oncehuman-x-probe.json
          if-no-files-found: ignore
