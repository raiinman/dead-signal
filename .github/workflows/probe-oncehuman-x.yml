name: Probe public Once Human X timeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-oncehuman-x.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Probe public profile
        run: |
          python - <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright

          URL = 'https://x.com/OnceHuman_'

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(
                      viewport={"width": 1440, "height": 1200},
                      locale='en-US',
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
                  )
                  page = await context.new_page()
                  response = await page.goto(URL, wait_until='domcontentloaded', timeout=60000)
                  await page.wait_for_timeout(12000)

                  # Scroll a few times so X has a chance to hydrate/load the public timeline.
                  for _ in range(4):
                      await page.mouse.wheel(0, 900)
                      await page.wait_for_timeout(2500)

                  hrefs = await page.locator('a').evaluate_all('(els) => els.map(a => a.href)')
                  pattern = re.compile(r'https://x\\.com/OnceHuman_/status/(\\d+)', re.I)
                  statuses = {}
                  for href in hrefs:
                      if not isinstance(href, str):
                          continue
                      m = pattern.match(href)
                      if m:
                          statuses[m.group(1)] = href.split('?')[0]

                  ordered = sorted(statuses.items(), key=lambda kv: int(kv[0]), reverse=True)
                  body_text = (await page.locator('body').inner_text())[:12000]
                  result = {
                      'http_status': response.status if response else None,
                      'title': await page.title(),
                      'final_url': page.url,
                      'status_count': len(ordered),
                      'statuses': ordered[:20],
                      'body_preview': body_text,
                  }
                  print('PROBE_RESULT_BEGIN')
                  print(json.dumps(result, ensure_ascii=False, indent=2))
                  print('PROBE_RESULT_END')
                  await page.screenshot(path='oncehuman-x-probe.png', full_page=True)
                  Path('oncehuman-x-probe.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
                  await browser.close()

          asyncio.run(main())
          PY

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oncehuman-x-probe
          path: |
            oncehuman-x-probe.png
            oncehuman-x-probe.json
          if-no-files-found: ignore
