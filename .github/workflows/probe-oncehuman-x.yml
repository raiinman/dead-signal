name: Probe public Once Human X timeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-oncehuman-x.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright client
        run: python -m pip install --disable-pip-version-check playwright

      - name: Probe rendered public posts
        run: |
          python - <<'PY'
          import asyncio, json, re, shutil
          from pathlib import Path
          from playwright.async_api import async_playwright

          URL = 'https://x.com/OnceHuman_'
          STATUS_RE = re.compile(r'/OnceHuman_/status/(\d+)', re.I)

          async def extract_post(article):
              links = await article.locator('a[href*="/OnceHuman_/status/"]').evaluate_all(
                  '(els) => els.map(a => a.getAttribute("href") || a.href || "")'
              )
              status_id = ''
              status_url = ''
              for href in links:
                  if not isinstance(href, str):
                      continue
                  m = STATUS_RE.search(href)
                  if not m:
                      continue
                  status_id = m.group(1)
                  status_url = f'https://x.com/OnceHuman_/status/{status_id}'
                  break
              if not status_id:
                  return None

              text = ''
              text_node = article.locator('[data-testid="tweetText"]').first
              if await text_node.count():
                  try:
                      text = (await text_node.inner_text()).strip()
                  except Exception:
                      pass

              created_at = ''
              time_node = article.locator('time').first
              if await time_node.count():
                  try:
                      created_at = (await time_node.get_attribute('datetime') or '').strip()
                  except Exception:
                      pass

              media = []
              for src in await article.locator('img').evaluate_all('(els) => els.map(img => img.src || "")'):
                  if isinstance(src, str) and 'pbs.twimg.com/media/' in src and src not in media:
                      media.append(src)

              avatar = ''
              for src in await article.locator('img').evaluate_all('(els) => els.map(img => img.src || "")'):
                  if isinstance(src, str) and 'pbs.twimg.com/profile_images/' in src:
                      avatar = src
                      break

              aria = ''
              group = article.locator('[role="group"]').last
              if await group.count():
                  try:
                      aria = (await group.get_attribute('aria-label') or '').strip()
                  except Exception:
                      pass

              return {
                  'id': status_id,
                  'url': status_url,
                  'created_at': created_at,
                  'text': text,
                  'media': media[:4],
                  'avatar': avatar,
                  'engagement_label': aria,
              }

          async def main():
              async with async_playwright() as p:
                  chrome = shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium')
                  if not chrome:
                      raise RuntimeError('No system Chrome/Chromium found on runner')

                  browser = await p.chromium.launch(executable_path=chrome, headless=True)
                  context = await browser.new_context(
                      viewport={"width": 1440, "height": 1200},
                      locale='en-US',
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
                  )
                  page = await context.new_page()
                  response = await page.goto(URL, wait_until='domcontentloaded', timeout=60000)
                  await page.wait_for_timeout(10000)

                  for _ in range(4):
                      await page.mouse.wheel(0, 1000)
                      await page.wait_for_timeout(2200)

                  articles = page.locator('article[data-testid="tweet"]')
                  posts_by_id = {}
                  for i in range(await articles.count()):
                      post = await extract_post(articles.nth(i))
                      if post:
                          posts_by_id[post['id']] = post

                  posts = sorted(posts_by_id.values(), key=lambda item: int(item['id']), reverse=True)
                  result = {
                      'http_status': response.status if response else None,
                      'title': await page.title(),
                      'final_url': page.url,
                      'article_count': await articles.count(),
                      'post_count': len(posts),
                      'posts': posts[:12],
                      'body_preview': (await page.locator('body').inner_text())[:8000],
                  }
                  print('PROBE_RESULT_BEGIN')
                  print(json.dumps(result, ensure_ascii=False, indent=2))
                  print('PROBE_RESULT_END')
                  Path('oncehuman-x-probe.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
                  await page.screenshot(path='oncehuman-x-probe.png', full_page=True)
                  await browser.close()

          asyncio.run(main())
          PY

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oncehuman-x-probe
          path: |
            oncehuman-x-probe.png
            oncehuman-x-probe.json
          if-no-files-found: ignore
