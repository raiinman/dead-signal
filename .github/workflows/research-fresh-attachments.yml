name: Research archived Attachment compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-fresh-attachments.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archived fresh corpus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p /tmp/dead-signal-fresh
          7z x -y data.7z -o/tmp/dead-signal-fresh >/dev/null
      - name: Count direct Attachment compatibility evidence
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/dead-signal-fresh')
          contracts = []
          for path in root.rglob('*.json'):
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if isinstance(payload, dict) and payload.get('schema') == 'dead-signal-attachments':
                  contracts.append((path, payload))

          pattern = re.compile(r'(?i)(?:can be equipped on|fits all)\s+[^.]+')
          print('ATTACHMENT_CONTRACTS', len(contracts))
          for path, payload in contracts:
              rows = [row for row in payload.get('attachments', []) if isinstance(row, dict)]
              direct = []
              unresolved = []
              for row in rows:
                  description = str(row.get('description') or '').strip().replace('\n', ' ')
                  match = pattern.search(description)
                  if match:
                      direct.append((row, match.group(0)))
                  else:
                      unresolved.append(row)
              print('CONTRACT', path)
              print('ROWS', len(rows))
              print('DIRECT_COMPATIBILITY_TEXT', len(direct))
              print('UNRESOLVED_COMPATIBILITY', len(unresolved))
              print('UNRESOLVED_ROWS_BEGIN')
              for row in unresolved:
                  print(json.dumps({
                      'canonical_id': row.get('canonical_id'),
                      'name': row.get('name'),
                      'attachment_type': row.get('attachment_type'),
                      'description': row.get('description') or '',
                  }, ensure_ascii=False))
              print('UNRESOLVED_ROWS_END')
          PY
