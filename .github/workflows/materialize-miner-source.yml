name: Verify Miner source

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/miner/src/**'
      - 'tools/miner/tests/**'
      - 'tools/miner/requirements*.txt'
      - 'tools/miner/VERSION'
      - '.github/workflows/materialize-miner-source.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/miner/requirements.txt

      - name: Install Miner dependencies
        run: python -m pip install -r tools/miner/requirements.txt

      - name: Compile-check maintained source
        run: python -m compileall -q tools/miner/src tools/miner/tests

      - name: Run Miner unit tests
        run: python -m unittest discover -s tools/miner/tests -v

