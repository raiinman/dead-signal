name: Materialize Miner source

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/miner/imports/v1.5.7.4/**'
      - 'tools/miner/scripts/materialize_source_snapshot.py'
      - '.github/workflows/materialize-miner-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct and verify source snapshot
        run: python tools/miner/scripts/materialize_source_snapshot.py

      - name: Compile-check recovered source with Python 3.11
        run: python -m compileall -q tools/miner/src

      - name: Commit materialized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/miner/src tools/miner/docs/package-v1.5.7.4
          if git diff --cached --quiet; then
            echo "No materialized source changes."
            exit 0
          fi
          git commit -m "Materialize Miner v1.5.7.4 source"
          git push origin HEAD:main
