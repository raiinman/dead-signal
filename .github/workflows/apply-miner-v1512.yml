name: Apply Miner v1.5.12 source patch

on:
  push:
    paths:
      - 'tools/miner/patches/v1.5.12-source-patch.tar.gz'
      - '.github/workflows/apply-miner-v1512.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v1.5.12 source
        run: tar -xzf tools/miner/patches/v1.5.12-source-patch.tar.gz -C tools/miner

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/miner/requirements.txt

      - name: Install Miner dependencies
        run: python -m pip install -r tools/miner/requirements.txt

      - name: Compile-check maintained source
        run: PYTHONPATH=tools/miner/src:tools/miner/src/extractor:tools/miner/src/neoxtractor python -m compileall -q tools/miner/src tools/miner/tests

      - name: Run Miner unit tests
        run: PYTHONPATH=tools/miner/src:tools/miner/src/extractor:tools/miner/src/neoxtractor python -m unittest discover -s tools/miner/tests -v

      - name: Commit verified source
        run: |
          rm tools/miner/patches/v1.5.12-source-patch.tar.gz
          rm .github/workflows/apply-miner-v1512.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Miner v1.5.12 publishing and integrity"
          git push origin HEAD:main
