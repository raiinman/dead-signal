name: Apply Miner v1.5.12 source patch

on:
  push:
    paths:
      - '.github/workflows/apply-miner-v1512.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify source patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'tools/miner/patches/v1.5.12-source-patch.part-*' | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Expected 5 patch chunks, found $($parts.Count)." }
          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $archive = 'tools/miner/patches/v1.5.12-source-patch.tar.gz'
          [System.IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '0843aa7c6e2bdba7f8bc78e50bafb3651908b6e3215eb4e92f444f7e0d81b434') { throw "Patch SHA-256 mismatch: $hash" }
          tar -xzf $archive -C tools/miner
          if ((Get-Content 'tools/miner/VERSION' -Raw).Trim() -ne '1.5.12.0') { throw 'Decoded patch did not install Miner v1.5.12.0.' }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/miner/requirements.txt

      - name: Install Miner dependencies
        run: python -m pip install -r tools/miner/requirements.txt

      - name: Compile-check maintained source
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'tools/miner/src;tools/miner/src/extractor;tools/miner/src/neoxtractor'
          python -m compileall -q tools/miner/src tools/miner/tests

      - name: Run Miner unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'tools/miner/src;tools/miner/src/extractor;tools/miner/src/neoxtractor'
          python -m unittest discover -s tools/miner/tests -v

      - name: Commit verified source
        shell: pwsh
        run: |
          Remove-Item 'tools/miner/patches/v1.5.12-source-patch.tar.gz' -Force
          Remove-Item 'tools/miner/patches/v1.5.12-source-patch.part-*' -Force
          Remove-Item '.github/workflows/apply-miner-v1512.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Miner v1.5.12 publishing and integrity'
          git push origin HEAD:main
