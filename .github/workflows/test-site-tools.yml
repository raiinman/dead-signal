name: Test database website data paths

on:
  push:
    branches:
      - main
    paths:
      - 'tools/site/**'
      - 'database/**'
      - 'preview/build-lab/index.html'
      - 'preview/build-lab/weapon-data-adapter.js'
      - 'preview/build-lab/weapon-model-ui.js'
      - 'preview/build-lab/catalogue-handoff.js'
      - 'preview/build-lab/canonical-category-variant-guard.js'
      - 'preview/build-lab/canonical-category-bridge.js'
      - '.cpanel.yml'
      - '.github/workflows/test-site-tools.yml'
  workflow_dispatch:

concurrency:
  group: dead-signal-site-tools-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test compact database materializers and audits
        run: python -m unittest discover -s tools/site/tests -v

      - name: Syntax-check database browser modules
        run: |
          node --check database/weapons/catalogue.js
          node --check database/weapons/weapon-public-adapter.js
          node --check database/weapons/weapon-detail-extras.js
          node --check database/weapons/weapons-data.js
          node --check database/armor/armor.js
          node --check database/armor/armor-data.js
          node --check database/extended-catalogue.js
          node --check database/calibrations/calibrations-data.js
          node --check database/mods/mods-data.js
          node --check database/attachments/attachments-data.js
          node --check database/deviations/deviations-data.js
          node --check database/cradles/cradles-data.js
          node --check preview/build-lab/weapon-data-adapter.js
          node --check preview/build-lab/weapon-model-ui.js
          node --check preview/build-lab/catalogue-handoff.js
          node --check preview/build-lab/canonical-category-variant-guard.js
          node --check preview/build-lab/canonical-category-bridge.js
